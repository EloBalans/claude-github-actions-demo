<label class="field">
  <span class="field__label">Search titles</span>
  <input
    type="search"
    class="field__input"
    placeholder="ship, checkout, storage…"
    autocomplete="off"
    [value]="search()"
    (input)="onSearchInput($event)"
  />
</label>

<div class="chips" role="group" aria-label="Filter by status">
  <button
    type="button"
    class="chip"
    [class.chip--on]="selectedStatus() === null"
    (click)="selectedStatusChange.emit(null)"
  >
    all
  </button>
  @for (status of statuses(); track status) {
  <button
    type="button"
    class="chip"
    [attr.data-status]="status"
    [class.chip--on]="selectedStatus() === status"
    (click)="selectedStatusChange.emit(status)"
  >
    {{ status }}
  </button>
  }
</div>

<button
  type="button"
  class="chip"
  [attr.aria-label]="'Sorted ' + sortOrderLabel() + '. Click to flip the order.'"
  (click)="onSortOrderToggle()"
>
  {{ sortOrderLabel() }}
</button>

@if (selectedTag(); as tag) {
<button
  type="button"
  class="chip chip--on chip--tag"
  [attr.aria-label]="'Clear the ' + tag + ' tag filter'"
  (click)="selectedTagChange.emit(null)"
>
  {{ tag }} ×
</button>
}
