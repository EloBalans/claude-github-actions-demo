# Automation mode: a `prompt` is supplied, so Claude runs without a mention.
name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: '/angular-review'
          # The MCP server that posts inline comments only starts when
          # --allowedTools names it, even though the skill declares it too.
          claude_args: >-
            --allowedTools "mcp__github_inline_comment__create_inline_comment"
            --max-turns 20
